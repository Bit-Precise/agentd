openapi: 3.0.3
info:
  title: agentserver instance admin API
  version: v1
  description: |
    agentserver（控制面，管理平台）的 instance admin 接口。Web 管理控制台由本文档生成，普通用户使用独立的
    `docs/agentserver-user-openapi.yaml`，不与本 API 共用 operation。

    agentserver 对外只有两个接口：relay 会话（Noise_IK 跑在 WebSocket / XHTTP / HTTP Upgrade 上，见 docs/protocol.md 5.8）
    和本文定义的 admin API。节点不连 agentserver，所以这里没有任何面向 agentd 的端点。

    - 监听地址是 AgentserverConfiguration 的 `admin_listen`（默认 127.0.0.1:7800）。要从别的机器管理就把它放在
      SSH 隧道或自己的反向代理后面；每个请求带 `Authorization: Bearer <admin token>`，令牌来自 `admin_token_env` 指定的环境变量。
    - `agentserver` 是服务端程序，没有管理子命令（只有 `run`、`backup`、`version`，设计文档 9.3）：workspace、relay、令牌、路由表与策略
      都经这里管理。`agentserver backup` 直接读状态库，不经 HTTP。
    - 所有名字（workspace、节点、组、服务、relay）都是 RFC 1123 label；公钥一律是 base64url 无填充的 43 字符。
    - 写操作都是幂等或带明确冲突语义的；变更立即生效：相关节点收到签名的 Update / PolicyUpdate / Notice，relay 收到 RelayInvalidate。
    - 错误统一返回 `Error`，`code` 与协议状态码同名时含义相同（如 NAME_TAKEN、TOKEN_USED）。
    - 本文档只描述 instance admin surface；普通用户 surface 见 `docs/agentserver-user-openapi.yaml`，两者使用不同的 URL 前缀、凭据和 operation。
    - 每个 operation 的 `x-audience` 与 `x-authorization` 都明确标记访问者。agentd 与 relay 的 Noise/transport 接口不走任一 Web API，
      在协议文档中分别标记为机器访问者。
    - instance admin 是实例级管理员，可管理 instance 配置、全局 users、workspace 生命周期、nodes、routes、policies 与 relay。
    - 对应设计文档 v0.27、协议规范 v0.7。
servers:
  - url: http://127.0.0.1:7800/api/v1/admin
    description: 本机 instance admin 端点（默认）
security:
  - AdminToken: []
x-api-surfaces:
  admin:
    base_path: /api/v1/admin
    auth: AdminToken
    document: docs/agentserver-openapi.yaml
  user:
    base_path: /api/v1
    auth: UserBearer
    document: docs/agentserver-user-openapi.yaml
x-rbac:
  audiences:
    web_user: 浏览器或自动化调用 admin API 的人类用户
    agentd: 节点守护进程，通过 relay 的 Noise/transport 会话收发目录、策略与流量控制消息
    relay: 中继，通过 transport 会话接入节点并与 agentserver 交换控制消息
  instance_roles:
    instance_admin: >-
      管理 instance 的域名、DNS provider、certificate issuer、OIDC provider；管理全局 users、workspaces、nodes、routes、policies、relay，
      并可对任意 workspace 执行 break-glass 管理。
  workspace_roles:
    owner: 管理 workspace 成员、角色、workspace 设置与全部运行配置
    maintainer: 管理路由、策略、组、节点角色上限、加入令牌和证书等运行配置
    member: 读取 workspace 目录、服务、路由、策略和证书状态
  enforcement: >-
    本文档的每个 operation 都要求 instance_admin。普通用户的 workspace role 只在 user API 文档中出现；当前部署的静态
    AdminToken 是 instance_admin，UserBearer 在接入 OIDC 后映射到 users 与 workspace_members。
x-instance-admin:
  managed_resources: [domains, dns_providers, certificate_issuers, auth_providers, users, workspaces, nodes, routes, policies, relays]
  provider_support:
    dns: [dnspod, cloudflare]
    certificate_issuer: [lets_encrypt, google_trust_services]
    auth:
      supported_first_phase: [oidc]
      extensible: true
  secret_handling: >-
    provider credentials are accepted as write-only request fields over the authenticated TLS API and are omitted from every response;
    they must never be logged or echoed by the service.
x-state-machines:
  instance_domain:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [active, failed, disabled, deleted], active: [disabled, failed, deleted], disabled: [pending, active, deleted], failed: [pending, disabled, deleted], deleted: []}
  dns_provider:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [active, failed, disabled, deleted], active: [disabled, failed, deleted], disabled: [pending, active, deleted], failed: [pending, active, disabled, deleted], deleted: []}
  certificate_issuer:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [active, failed, disabled, deleted], active: [disabled, failed, deleted], disabled: [pending, active, deleted], failed: [pending, active, disabled, deleted], deleted: []}
  auth_provider:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [active, failed, disabled, deleted], active: [disabled, failed, deleted], disabled: [pending, active, deleted], failed: [pending, active, disabled, deleted], deleted: []}
  user:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [active, disabled], active: [disabled, deleted], disabled: [active, deleted]}
  user_identity:
    initial: active
    terminal: [deleted]
    transitions: {active: [disabled, deleted], disabled: [active, deleted], deleted: []}
  workspace:
    initial: provisioning
    terminal: [deleted]
    transitions: {provisioning: [active, failed, deleted], active: [disabled, deleting, failed], disabled: [active, deleting], failed: [provisioning, deleted], deleting: [deleted, failed]}
  workspace_member:
    initial: active
    terminal: [deleted]
    transitions: {active: [suspended, revoked, deleted], suspended: [active, revoked, deleted], revoked: [deleted], deleted: []}
  join_token:
    initial: active
    terminal: [used, expired, revoked, deleted]
    transitions: {active: [used, expired, revoked, deleted], used: [deleted], expired: [deleted], revoked: [deleted], deleted: []}
  node:
    initial: joining
    terminal: [deleted]
    transitions: {joining: [active, failed, removed, deleted], active: [disabled, removed, deleted], disabled: [active, removed, deleted], failed: [joining, removed, deleted], removed: [deleted], deleted: []}
  group:
    initial: active
    terminal: [deleted]
    transitions: {active: [disabled, deleted], disabled: [active, deleted], deleted: []}
  route:
    initial: active
    terminal: [deleted]
    transitions: {active: [disabled, deleted], disabled: [active, deleted], deleted: []}
  policy:
    initial: active
    terminal: [deleted]
    transitions: {active: [disabled, deleted], disabled: [active, deleted], deleted: []}
  service:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [ready, failed, disabled, deleted], ready: [disabled, failed, deleted], failed: [pending, disabled, deleted], disabled: [pending, ready, deleted], deleted: []}
  certificate:
    initial: pending
    terminal: [deleted]
    transitions: {pending: [ready, failed, revoked, deleted], ready: [renewing, expired, revoked, deleted], renewing: [ready, failed, expired, revoked, deleted], expired: [renewing, revoked, deleted], failed: [pending, renewing, revoked, deleted], revoked: [deleted], deleted: []}
  relay:
    initial: registering
    terminal: [deleted]
    transitions: {registering: [active, failed, deleted], active: [draining, disabled, failed], draining: [active, disabled, deleted], disabled: [active, deleted], failed: [registering, active, deleted], deleted: []}
  relay_token:
    initial: active
    terminal: [used, expired, revoked, deleted]
    transitions: {active: [used, expired, revoked, deleted], used: [deleted], expired: [deleted], revoked: [deleted], deleted: []}
x-join-token-invariant:
  probe_is_non_consuming: true
  consume_is_atomic: true
  single_relay_winner: >-
    agentd may submit the same token to only one selected relay. Agentserver atomically marks the token used;
    concurrent or retried submissions through another relay return TOKEN_USED and never create another membership.
x-audit:
  write_operations: required
  storage: append_only
  retention: configurable instance policy
  redaction: tokens, passwords, provider credentials, account keys, private keys and certificate bodies are never stored in event metadata
x-machine-interfaces:
  - audience: relay
    transport: TLS + WebSocket / HTTP Upgrade / XHTTP
    endpoints: [/ws, /up, /x/<session>, /.well-known/agentserver]
    description: relay 与 agentserver 的 Noise 会话和控制消息，不是 admin API。
  - audience: agentd
    transport: TLS + WebSocket / HTTP Upgrade / XHTTP
    endpoints: [/api/v1/join/candidates, /ws, /up, /x/<session>, /.well-known/agentd]
    description: agentd 先调用 join discovery 查询 relay candidates，再连接选中的 relay；不调用 admin API。
tags:
  - name: domains
    description: instance 级域名配置（仅 instance admin）
  - name: dns-providers
    description: instance 级 DNS provider 配置（仅 instance admin）
  - name: certificate-issuers
    description: instance 级证书签发方配置（仅 instance admin）
  - name: auth-providers
    description: instance 级认证服务配置（仅 instance admin）
  - name: users
    description: instance 级 用户目录（仅 instance admin）
  - name: server
    description: 服务端自身
  - name: workspaces
    description: workspace 的创建、域名与密钥；relay 由 agentd 动态选择
  - name: members
    description: workspace 成员与 owner / maintainer / member 角色
  - name: tokens
    description: 加入令牌与加入链接
  - name: nodes
    description: 目录里的成员
  - name: groups
    description: 实例组及其密钥
  - name: routes
    description: 路由表（源、协议、域名、目的）
  - name: policies
    description: 中央策略（按主体书写，渲染后下发给受管角色）
  - name: services
    description: 已注册的服务
  - name: certs
    description: workspace 的通配证书
  - name: certificates
    description: instance 级全部证书及其签发、续期、吊销生命周期（仅 instance admin）
  - name: audit
    description: 不可变写入审计记录（instance admin 全局可见）
  - name: relays
    description: relay 注册、候选池、证书与状态

paths:
  /domains:
    get:
      tags: [domains]
      operationId: listInstanceDomains
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 列出 instance 域名
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstanceDomain" }
    post:
      tags: [domains]
      operationId: createInstanceDomain
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 添加 instance 域名
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceDomainWrite" }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceDomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /domains/{domainId}:
    parameters:
      - name: domainId
        in: path
        required: true
        description: 域名实体 UUID
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [domains]
      operationId: getInstanceDomain
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查看 instance 域名
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceDomain" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [domains]
      operationId: updateInstanceDomain
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 更新 instance 域名
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceDomainWrite" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceDomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [domains]
      operationId: deleteInstanceDomain
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 删除 instance 域名
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dns-providers:
    get:
      tags: [dns-providers]
      operationId: listDNSProviders
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 列出 DNS providers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DNSProvider" }
    post:
      tags: [dns-providers]
      operationId: createDNSProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 创建 DNS provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSProviderWrite" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dns-providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [dns-providers]
      operationId: getDNSProvider
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查看 DNS provider
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [dns-providers]
      operationId: updateDNSProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 更新 DNS provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSProviderWrite" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [dns-providers]
      operationId: deleteDNSProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 删除 DNS provider
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /certificate-issuers:
    get:
      tags: [certificate-issuers]
      operationId: listCertificateIssuers
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 列出 certificate issuers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CertificateIssuer" }
    post:
      tags: [certificate-issuers]
      operationId: createCertificateIssuer
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 创建 certificate issuer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateIssuerWrite" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateIssuer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /certificate-issuers/{issuerId}:
    parameters:
      - name: issuerId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [certificate-issuers]
      operationId: getCertificateIssuer
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查看 certificate issuer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateIssuer" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [certificate-issuers]
      operationId: updateCertificateIssuer
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 更新 certificate issuer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateIssuerWrite" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateIssuer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [certificate-issuers]
      operationId: deleteCertificateIssuer
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 删除 certificate issuer
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth-providers:
    get:
      tags: [auth-providers]
      operationId: listAuthProviders
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 列出认证 providers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }
    post:
      tags: [auth-providers]
      operationId: createAuthProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 创建认证 provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthProviderWrite" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth-providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [auth-providers]
      operationId: getAuthProvider
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查看认证 provider
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [auth-providers]
      operationId: updateAuthProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 更新认证 provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthProviderWrite" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth-providers]
      operationId: deleteAuthProvider
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 删除认证 provider
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出全局用户
      description: 用户目录是 instance 级资源；workspace 成员关系只保存角色，不复制用户资料。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      tags: [users]
      operationId: upsertUser
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 创建或更新全局用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserWrite" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: email 已存在或用户归并冲突
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: 全局用户实体 UUID
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [users]
      operationId: getUser
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看全局用户
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 删除全局用户
      description: 删除用户目录记录，同时移除其所有 workspace membership；审计记录保留 subject 的不可逆摘要。
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 用户仍是某个 workspace 的最后一个 owner
          content:
            application/json:
