            schema: { $ref: "#/components/schemas/UserIdentityWrite" }
      responses:
        "201":
          description: 已关联
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserIdentity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/identities/{identityId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
      - name: identityId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [users]
      operationId: unlinkUserIdentity
      x-audit: required
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 解除外部认证 identity
      responses:
        "204": { description: 已解除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /audit/events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查询全局审计记录
      description: instance admin 可查询整个 instance 的所有写入事件；响应不包含 token、凭据、私钥或其他敏感正文。
      parameters:
        - name: actor_id
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: workspace_id
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: action
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { $ref: "#/components/schemas/AuditOutcome" }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }

  /audit/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [audit]
      operationId: getAuditEvent
      x-audience: [web_user]
      x-authorization: { scope: instance, roles: [instance_admin] }
      summary: 查看审计事件
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /server:
    get:
      tags: [server]
      operationId: getServer
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 服务端信息
      description: agentserver 自己的公钥只用于 relay 会话，节点不需要知道它。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /status:
    get:
      tags: [server]
      operationId: getStatus
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 运行状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出 instance 的全部证书
      description: >-
        返回 workspace wildcard、relay 和 agentserver 自身证书的统一生命周期视图。私钥和证书链正文不在此接口返回。
      parameters:
        - name: workspace
          in: query
          schema: { $ref: "#/components/schemas/Label" }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/CertificateState" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/CertificateKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }
    post:
      tags: [certificates]
      operationId: issueCertificate
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 签发或重新签发证书
      description: >-
        为 workspace 或其他受支持的证书对象启动签发。吊销后的证书必须通过此 operation 重新签发，
        生成新的 certificateId；已有 ready 证书不会被隐式覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateIssue" }
      responses:
        "202":
          description: 已开始签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /certificates/{certificateId}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      tags: [certificates]
      operationId: getCertificate
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看证书生命周期状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "404": { $ref: "#/components/responses/NotFound" }

  /certificates/{certificateId}/renew:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: renewCertificate
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 立即续期证书
      description: >-
        异步触发续期；证书进入 renewing，成功后回到 ready，失败保留旧证书并记录 last_error。
        已 revoked 的证书不能自动续期，需先重新签发。
      responses:
        "202":
          description: 已开始续期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /certificates/{certificateId}/revoke:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: revokeCertificate
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 吊销证书
      description: >-
        立即将证书标记为 revoked，停止向 relay 下发，并向配置的 certificate issuer 执行吊销（issuer 支持时）。
        吊销不可逆；需要新证书时使用 issue/reissue 流程生成新的 certificateId。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRevoke" }
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出 workspace
      description: 返回 instance 中的全部 workspace。普通用户的 membership 列表使用普通用户 API 的 `GET /api/v1/workspaces`，不调用此 admin operation。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 创建 workspace
      description: |
        生成 workspace 密钥对（公钥是成员唯一的信任根），申请通配证书（ACME DNS-01，完成前服务处于 cert_pending）。
        workspace 不绑定 relay；agentd 收到 Welcome 的 relay 候选后自行选择最合适的 relay，并可在运行中切换。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 名字或基础域名已存在（code NAME_TAKEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看 workspace（公钥、基础域名、状态和证书）
      description: >-
        `public_key` 就是加入链接里的 `key` 与成员配置里的 `workspace.public_key`。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 删除 workspace
      description: 向全部成员发 `Notice{REMOVED}`，吊销成员证书，通知 relay 关闭会话，删除证书；成员的密钥文件不受影响。
      parameters:
        - name: force
          in: query
          description: 仍有成员时也删除；不带则有成员的 workspace 返回 409
          schema: { type: boolean, default: false }
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 仍有成员（code WORKSPACE_NOT_EMPTY）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/tokens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [tokens]
      operationId: listTokens
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出未使用的加入令牌
      description: 服务端只存令牌的 SHA-256，列表里没有令牌本身。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
    post:
      tags: [tokens]
      operationId: createToken
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 签发加入令牌并返回加入链接
      description: |
        令牌 16 字节随机数、一次性、默认 24 小时；绑定 workspace、可选的实例名与角色上限。
        agentserver 只返回一次性的 `join_token`。agentd 拿到 token 后先向 machine join API 查询 relay candidates，
        再选择一个 relay 提交 token；创建 token 的响应不携带 candidates，也不绑定单个 relay。
        令牌明文只在这次响应里出现一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 指定的名字已被节点或服务占用（code NAME_TAKEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: tokenId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [tokens]
      operationId: revokeToken
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 作废未使用的令牌
      responses:
        "204": { description: 已作废 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [members]
      operationId: listWorkspaceMembers
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出 workspace 成员
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMember" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [members]
      operationId: upsertWorkspaceMember
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 添加或调整 用户角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMemberWrite" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 会破坏 workspace 的 owner 约束
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: memberId
        in: path
        required: true
        description: workspace membership 实体 UUID
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [members]
      operationId: removeWorkspaceMember
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 移除 workspace 成员
      responses:
        "204": { description: 已移除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: workspace 必须至少保留一个 owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/nodes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [nodes]
      operationId: listNodes
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出成员
      description: 在线状态与所连 relay 来自 relay 的 `RelayPresence`。
      parameters:
        - name: online
          in: query
          description: 只列在线或只列离线
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Node" }

  /workspaces/{workspaceId}/nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [nodes]
      operationId: getNode
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看成员
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [nodes]
      operationId: updateNode
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 改名或调整角色上限
      description: |
        改名只改目录，其他节点规则里写的是公钥，不受影响；
        调整角色上限后超出上限的 Advertise 与开流立即被拒。节点收到签名的 `Notice{RENAMED / ROLES_CHANGED}`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 新名字已被占用（code NAME_TAKEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [nodes]
      operationId: removeNode
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 移除成员
      description: |
        目录移除并推送 `Update.removed_members`，停止续发成员证书并推吊销，
        向 relay 推 `RelayInvalidate{removed}` 关闭其会话。其他节点规则里写的这把公钥仍在，但目录里查不到，`agentd status` 会告警。
        换设备就是 remove 后用同一个名字重新签令牌、在新设备 join。
      responses:
        "204": { description: 已移除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/groups:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [groups]
      operationId: listGroups
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出组
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [groups]
      operationId: createGroup
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 创建组
      description: 生成组密钥对；返回的 `public_key` 可以直接写进节点规则的 `public_key`，名字形式是 `agentd://<ws 域名>/group/<name>`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 组名已存在（code NAME_TAKEN）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [groups]
      operationId: getGroup
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看组
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [groups]
      operationId: deleteGroup
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 删除组
      description: 向全部节点推送该组公钥的吊销（issuer 维度），引用它的中央策略条目失效并重渲染。
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/groups/{groupId}/nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/NodeId"
    put:
      tags: [groups]
      operationId: addGroupNode
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 把 node 加入组
      description: 给该 node 签发 group-node membership 证书（1 小时，过半续发），经签名的 `Update.memberships` 送达；不触发策略重渲染，因为规则里只有组公钥。
      responses:
        "204": { description: 已加入（重复加入也是 204） }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [groups]
      operationId: removeGroupNode
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 把 node 移出组
      description: 停止续发并推送吊销记录 `(member, issuer, until)`。
      responses:
        "204": { description: 已移出 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/routes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [routes]
      operationId: getRouteTable
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看路由表
      description: 路由表只在 agentserver 上；节点收到的是按节点渲染、去掉目的的分流表。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteTable" }
    put:
      tags: [routes]
      operationId: replaceRouteTable
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 整体替换路由表
      description: 版本号加一，重新渲染并推送所有 ingress 节点的分流表，向 relay 推 `RelayInvalidate`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteTableWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteTable" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [routes]
      operationId: addRoute
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 追加一条路由
      description: 追加到末尾；同等具体时书写顺序靠前的优先。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteWrite" }
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /workspaces/{workspaceId}/routes/{routeId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: routeId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [routes]
      operationId: deleteRoute
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 删除一条路由
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/policies:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [policies]
      operationId: listPolicies
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出中央策略语句
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyStatement" }
    put:
      tags: [policies]
      operationId: replacePolicies
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 整体替换中央策略
      description: >-
        按设计文档 6.8 重新渲染：每个 `policy_source: server` 的提供侧角色得到一份 (public_key, action, target) 列表，经签名的 `PolicyUpdate` 下发并等待 `PolicyApplied`；向 relay 推 `RelayInvalidate`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/PolicyStatementWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [policies]
      operationId: addPolicy
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 追加一条策略语句
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyStatementWrite" }
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /workspaces/{workspaceId}/policies/{policyId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: policyId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [policies]
      operationId: deletePolicy
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 删除一条策略语句
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/services:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [services]
      operationId: listServices
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出已注册的服务
      description: 服务由节点在 `Advertise` 里注册，这里只读；状态 `cert_pending` 表示 workspace 的通配证书还没签下来。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  /relays:
    get:
      tags: [relays]
      operationId: listRelays
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出 relay
      description: "`connected` 表示 relay 会话当前在线。"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Relay" }
    post:
      tags: [relays]
      operationId: registerRelay
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 注册 relay
      description: |
        登记 relay 的公钥、transport 端点与 STUN 地址；之后该 relay 用这把密钥建立 relay 会话。
        relay 证书按需由 workspace 密钥签发；agentd 选择 relay 后，relay 通过控制会话取得对应证书。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayCreate" }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 名字或公钥已注册（code NAME_TAKEN / IDENTITY_IN_USE）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /relays/tokens:
    get:
      tags: [relays]
      operationId: listRelayTokens
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 列出未使用的 relay 注册令牌
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelayToken" }
    post:
      tags: [relays]
      operationId: createRelayToken
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 签发 relay 注册令牌
      description: >-
        relay 首次连接时在握手载荷里带上这个令牌和自己的名字、URL、STUN 地址，
        agentserver 用它的公钥自动登记（不必手工复制公钥）。令牌一次性，明文只在这次响应里出现。
        AgentserverConfiguration 的 `relay_join_token_env` 还可以给出一个长期有效的引导令牌（helm chart 用它）。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayTokenCreate" }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayTokenCreated" }

  /relays/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [relays]
      operationId: revokeRelayToken
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 作废 relay 注册令牌
      responses:
        "204": { description: 已作废 }
        "404": { $ref: "#/components/responses/NotFound" }

  /relays/{relayId}:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [relays]
      operationId: getRelay
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看 relay
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [relays]
      operationId: removeRelay
      x-audit: required
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 注销 relay
      description: relay 进入 deleted 后不再作为 agentd 候选，关闭 relay 会话；已存在证书按生命周期处理。
      responses:
        "204": { description: 已注销 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: relay 仍有活动会话或证书引用（code RELAY_IN_USE）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /relays/{relayId}/certs:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [relays]
      operationId: listRelayCerts
      x-audience: [web_user]
      x-authorization:
        scope: instance
        roles: [instance_admin]
      summary: 查看该 relay 持有的 relay 证书
      description: relay 按需缓存 workspace 证书；证书由 workspace 密钥签发，与 `/.well-known/agentd?workspace=…` 公布的内容一致。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelayCert" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    AdminToken:
      type: http
      scheme: bearer
      description: >-
        bootstrap instance-admin 令牌，来自 AgentserverConfiguration 的 `admin_token_env` 指定的环境变量。
        它不代表某个 workspace 用户；接入身份提供方后，Web 请求应携带能映射到 workspace role 的 bearer principal。

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: workspace 实体 UUID
      schema: { $ref: "#/components/schemas/Uuid" }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: node 实体 UUID
      schema: { $ref: "#/components/schemas/Uuid" }
    GroupId:
      name: groupId
      in: path
      required: true
      description: group 实体 UUID
      schema: { $ref: "#/components/schemas/Uuid" }
    RelayId:
      name: relayId
      in: path
      required: true
      description: relay 实体 UUID
      schema: { $ref: "#/components/schemas/Uuid" }
    CertificateId:
      name: certificateId
      in: path
      required: true
      description: 证书的稳定 UUID；name/path 参数只用于资源查找，不是实体主键。
      schema: { $ref: "#/components/schemas/Uuid" }

  responses:
    BadRequest:
      description: 请求不合法（code BAD_REQUEST / BAD_NAME / INVALID_ARGUMENTS）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 当前用户没有该 workspace 或 operation 的权限（code FORBIDDEN）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 操作违反资源约束（code CONFLICT）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 对象不存在（code NOT_FOUND）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    InstanceRole:
      type: string
      enum: [instance_admin]
      description: 实例级管理员，可管理 instance 配置、workspace 生命周期与 relay。
    WorkspaceRole:
      type: string
      enum: [owner, maintainer, member]
      description: workspace 内 用户角色；owner 管理成员与 workspace，maintainer 管理运行配置，member 只读。
    Audience:
      type: string
      enum: [web_user, agentd, relay]
      description: 预期访问者。agentd 与 relay 的机器接口是 Noise/transport，不走本 admin API。
    InstanceDomain:
      type: object
      required: [id, domain, default]
      properties:
        id: { allOf: [{ $ref: "#/components/schemas/Uuid" }], readOnly: true }
        domain:
          type: string
          format: hostname
          description: instance 管理的域名或域名后缀，统一小写且不带末尾点。
        default:
          type: boolean
          description: 是否作为 workspace 未指定 base_domain 时的默认父域名；最多一个。
        status:
          allOf: [{ $ref: "#/components/schemas/DomainStatus" }]
          readOnly: true
          description: agentserver 对该域名配置和证书/DNS 准备情况的状态。
        last_error:
          type: string
          readOnly: true
          description: status=failed 时的最近错误。
        verified_at:
          type: string
          format: date-time
          readOnly: true
          description: 域名最近一次验证或成功配置的时间。
        dns_provider_id:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          description: 负责该域名 DNS-01 与可选公网记录的 DNSProvider.id。
        certificate_issuer_id:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          description: 为该域名签发证书的 CertificateIssuer.id。
    DNSProvider:
      type: object
      required: [id, name, kind, zones]
      properties:
        id: { allOf: [{ $ref: "#/components/schemas/Uuid" }], readOnly: true }
        name: { $ref: "#/components/schemas/Label" }
        kind:
          type: string
          enum: [dnspod, cloudflare]
        zones:
          type: array
          minItems: 1
          items: { type: string, format: hostname }
          description: 该账号允许操作的 DNS zone；域名按最长后缀匹配。
        credentials:
          type: object
          writeOnly: true
          additionalProperties: { type: string }
          description: 写入时提交的 provider 凭据（Cloudflare 可用 api_token，DNSPod 可用 secret_id / secret_key）；API 响应不返回它。
        status: { $ref: "#/components/schemas/DNSProviderStatus", readOnly: true }
    CertificateIssuer:
      type: object
      required: [id, name, kind, directory]
      properties:
        id: { allOf: [{ $ref: "#/components/schemas/Uuid" }], readOnly: true }
        name: { $ref: "#/components/schemas/Label" }
        kind:
          type: string
          enum: [lets_encrypt, google_trust_services]
        directory:
          type: string
          format: uri
          description: ACME directory；LE 或 GTS 的预置默认地址，也允许 instance admin 显式覆盖。
        eab_key_id:
          type: string
          writeOnly: true
          description: 写入时提交的 EAB key id，不返回。
        eab_hmac_key:
          type: string
          writeOnly: true
          description: 写入时提交的 EAB HMAC secret，不返回。
        email: { type: string, format: email }
        account_status: { allOf: [{ $ref: "#/components/schemas/IssuerAccountStatus" }], readOnly: true }
        account_created_at: { type: string, format: date-time, readOnly: true }
        status: { $ref: "#/components/schemas/CertificateIssuerStatus", readOnly: true }
    AuthProvider:
      type: object
      description: >-
        可扩展的认证服务配置。第一期支持 `kind: oidc`；后续增加认证类型时扩展 kind 和对应字段，
        不改变 auth_providers 集合的资源模型。
      required: [id, name, kind, issuer, client_id]
      properties:
        kind:
          type: string
          enum: [oidc]
          description: 第一期开启的认证类型；保留为可扩展 discriminator。
        id: { allOf: [{ $ref: "#/components/schemas/Uuid" }], readOnly: true }
        name: { $ref: "#/components/schemas/Label" }
        issuer:
          type: string
          format: uri
          description: OIDC issuer URL；必须通过 discovery 找到授权、token、jwks 端点。
        client_id: { type: string }
        client_secret:
          type: string
          writeOnly: true
          description: 写入时提交的 OIDC client secret，不返回明文。
        scopes:
          type: array
          items: { type: string }
          default: [openid, profile, email]
        claim_mapping:
          type: object
          description: 将 OIDC claims 映射到 subject、email、name、picture；subject 必须稳定且不可变。
          additionalProperties: { type: string }
        status: { $ref: "#/components/schemas/AuthProviderStatus", readOnly: true }
    InstanceDomainWrite:
      type: object
      required: [domain, default]
      properties:
        domain:
          type: string
          format: hostname
        default: { type: boolean }
        dns_provider_id: { $ref: "#/components/schemas/Uuid" }
        certificate_issuer_id: { $ref: "#/components/schemas/Uuid" }
    DNSProviderWrite:
      type: object
      required: [name, kind, zones]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        kind:
          type: string
          enum: [dnspod, cloudflare]
        zones:
          type: array
          minItems: 1
          items: { type: string, format: hostname }
        credentials:
          type: object
          writeOnly: true
          additionalProperties: { type: string }
    CertificateIssuerWrite:
      type: object
      required: [name, kind, directory]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        kind:
          type: string
          enum: [lets_encrypt, google_trust_services]
        directory: { type: string, format: uri }
        eab_key_id: { type: string, writeOnly: true }
        eab_hmac_key: { type: string, writeOnly: true }
        email: { type: string, format: email }
    AuthProviderWrite:
      type: object
      required: [name, kind, issuer, client_id]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        kind: { type: string, enum: [oidc] }
        issuer: { type: string, format: uri }
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }
        scopes:
          type: array
          items: { type: string }
        claim_mapping:
          type: object
          additionalProperties: { type: string }
    User:
      type: object
      required: [id, email, status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email:
          type: string
          format: email
          description: 归并用户的 canonical email；来自已验证的外部 identity。
        name:
          type: string
          readOnly: true
          description: 与 OIDC name claim 同步的用户名称。
        picture:
          type: string
          format: uri
          readOnly: true
          description: 与 OIDC picture claim 同步的头像 URL。
        instance_admin:
          type: boolean
          readOnly: true
          description: 是否拥有 instance 级管理员权限；只能通过 instance-admin operation 修改。
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserWrite:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled], default: active }
    InstanceAdminGrant:
      type: object
      required: [instance_admin]
      properties:
        instance_admin: { type: boolean }
    UserIdentity:
      type: object
      required: [id, user_id, provider_id, subject, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        user_id: { $ref: "#/components/schemas/Uuid" }
        provider_id: { $ref: "#/components/schemas/Uuid" }
        subject: { type: string, description: 该认证 provider 返回的稳定 subject }
        status: { $ref: "#/components/schemas/UserIdentityStatus" }
        email_verified: { type: boolean }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UserIdentityWrite:
      type: object
      required: [provider_id, subject]
      properties:
        provider_id: { $ref: "#/components/schemas/Uuid" }
        subject: { type: string }
        email_verified: { type: boolean }
    WorkspaceMember:
      type: object
      required: [id, user_id, role, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        user_id: { $ref: "#/components/schemas/Uuid" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/WorkspaceMemberStatus" }
    WorkspaceMemberWrite:
      type: object
      required: [user_id, role]
      properties:
        user_id: { $ref: "#/components/schemas/Uuid" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
    Uuid:
      type: string
      format: uuid
      description: 持久化实体的稳定 UUID；name、subject 和 path 参数不是实体主键。
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    AuditOutcome:
      type: string
      enum: [success, failure]
    AuditActor:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [instance_admin, user, agentd, relay, system]
        id: { type: string, description: actor UUID、external identity 或机器公钥标识 }
        auth_provider_id: { $ref: "#/components/schemas/Uuid" }
    AuditEvent:
      type: object
      required: [id, occurred_at, actor, action, resource_type, outcome, request_id]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        occurred_at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action: { type: string, description: 例如 workspace.create、certificate.renew、node.remove }
        resource_type: { type: string }
        resource_id: { $ref: "#/components/schemas/Uuid" }
        workspace_id: { $ref: "#/components/schemas/Uuid" }
        request_id: { type: string, description: 同一个 HTTP/协议请求及其后台任务的关联 ID }
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        error_code: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: 已脱敏上下文；不会包含 token、密码、凭据、私钥或证书正文。
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: string }
    DomainStatus:
      type: string
      enum: [pending, active, disabled, failed, deleted]
      description: 域名配置状态；pending 表示等待 DNS/证书等准备，active 表示可用，disabled 表示管理员停用。
    DNSProviderStatus:
      type: string
      enum: [pending, active, disabled, failed, deleted]
    CertificateIssuerStatus:
      type: string
      enum: [pending, active, disabled, failed, deleted]
    IssuerAccountStatus:
      type: string
      enum: [not_created, creating, ready, failed]
      description: ACME account 由 agentserver 生成和持久化的状态。
    AuthProviderStatus:
      type: string
      enum: [pending, active, disabled, failed, deleted]
    UserStatus:
      type: string
      enum: [pending, active, disabled, deleted]
    UserIdentityStatus:
      type: string
      enum: [active, disabled, deleted]
    WorkspaceStatus:
      type: string
      enum: [provisioning, active, disabled, failed, deleting, deleted]
    WorkspaceMemberStatus:
      type: string
      enum: [active, suspended, revoked, deleted]
    JoinTokenStatus:
      type: string
      enum: [active, used, expired, revoked, deleted]
    NodeStatus:
      type: string
      enum: [joining, active, disabled, failed, removed, deleted]
    GroupStatus:
      type: string
      enum: [active, disabled, deleted]
    RouteStatus:
      type: string
      enum: [active, disabled, deleted]
    PolicyStatus:
      type: string
      enum: [active, disabled, deleted]
    ServiceStatus:
      type: string
      enum: [pending, ready, failed, disabled, deleted]
    RelayStatus:
      type: string
      enum: [registering, active, draining, disabled, failed, deleted]
    RelayTokenStatus:
      type: string
      enum: [active, used, expired, revoked, deleted]
    Label:
      type: string
      description: RFC 1123 label，小写，≤ 63 字符
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    PublicKey:
      type: string
      description: Ed25519 公钥，base64url 无填充，43 字符
      pattern: "^[A-Za-z0-9_-]{43}$"
    Role:
      type: string
      enum: [ingress, submitter, egress, service, executor]
    Proto:
      type: string
      enum: [tls, ssh]
    PolicySource:
      type: string
      enum: [local, server]
    Subject:
      type: string
      description: |
        中央策略与路由表的主语：`node:<name>`、`group:<name>`、`workspace`、`public`，或 `agentd://<公钥>`。
        渲染给节点时换成对应的公钥，`public` 换成 `*`；`user:<邮箱>` 与 `usergroup:<name>` 留给后续的边缘登录。
      example: "group:pc"
    Match:
      type: object
      description: 域名模式；`set` 第一期不做
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [domain, suffix]
          description: domain 精确匹配；suffix 匹配本身及所有子域
        value:
          type: string
          description: 小写、无末尾点的域名
      example: { kind: suffix, value: ucas.edu.cn }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读的错误码，如 BAD_REQUEST、BAD_NAME、NAME_TAKEN、IDENTITY_IN_USE、NOT_FOUND、WORKSPACE_NOT_EMPTY、RELAY_IN_USE、ACME_FAILED
            message: { type: string }

    ServerInfo:
      type: object
      required: [public_key, version, protocol]
      properties:
        public_key:
          allOf: [{ $ref: "#/components/schemas/PublicKey" }]
          description: agentserver 的公钥，只用于 relay 会话（relay 配置的 `control.public_key`）
        version: { type: string, description: 软件版本，如 0.1.0 }
        protocol:
          type: object
          properties:
            major: { type: integer }
            min: { type: integer }
            max: { type: integer }
        domain: { type: string, deprecated: true, description: 兼容字段；instance 的完整域名配置见 GET /instance.domains }
        domains:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/InstanceDomain" }
          description: instance 当前管理的全部域名。

    Status:
      type: object
      properties:
        uptime_seconds: { type: integer }
        workspaces: { type: integer }
        relays_registered: { type: integer }
        relays_connected: { type: integer }
        nodes_total: { type: integer }
        nodes_online: { type: integer }
        certs_pending: { type: integer, description: 通配证书尚未签下的 workspace 数 }

    Workspace:
      type: object
      required: [id, name, domain_id, base_domain, public_key, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/Label" }
        domain_id:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          description: 创建 workspace 时选择的 instance domain。
        base_domain:
          type: string
          readOnly: true
          description: agentserver 根据 workspace name 和 domain_id 生成的最终基础域名；服务域名是 `<服务名>.<base_domain>`。
        public_key:
          allOf: [{ $ref: "#/components/schemas/PublicKey" }]
          description: workspace 公钥，成员唯一钉住的信任根；加入链接的 `key`
        status: { $ref: "#/components/schemas/WorkspaceStatus" }
        members: { type: integer, description: workspace 用户成员数，来自 workspace_members }
        nodes: { type: integer, description: workspace 中 agentd 节点总数 }
        nodes_online: { type: integer, description: 当前与 relay 保持在线会话的 agentd 节点数 }
        routes_version: { type: integer }
        directory_version: { type: integer }
        created_at: { type: string, format: date-time }
    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        domain_id:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          description: 可选的 instance domain；省略使用 instance 的默认 domain。不能直接提交 base_domain。
    Token:
      type: object
      required: [id, roles, status, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name:
          allOf: [{ $ref: "#/components/schemas/Label" }]
          description: 绑定的实例名；为空表示由加入的设备提出
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
          description: 角色上限
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/JoinTokenStatus" }
    TokenCreate:
      type: object
      properties:
        name: { $ref: "#/components/schemas/Label" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
          description: 省略表示不限
        ttl: { type: string, description: Go duration，如 `24h`；默认 24h }
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [join_token]
          properties:
            join_token:
              type: string
              description: 一次性 join token；只返回这一次，agentd 用它向 machine join API 查询 candidates 并完成加入。
            join_link:
              type: string
              deprecated: true
              description: 完整的加入链接，带 bootstrap relay、key（workspace 公钥）、token；只返回这一次
              example: "agentd://home.agentsrv.example.com/dorm?key=Rt7aB…&token=Qm9…"

    Node:
      type: object
      required: [id, name, public_key, role_caps, status, online, joined_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/Label" }
        public_key: { $ref: "#/components/schemas/PublicKey" }
        role_caps:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        online: { type: boolean }
        status: { $ref: "#/components/schemas/NodeStatus" }
        relay_id: { $ref: "#/components/schemas/Uuid", description: 当前所连 relay 实体 UUID；离线时为空 }
        last_seen: { type: string, format: date-time }
        joined_at: { type: string, format: date-time }
        policy_sources:
          type: object
          description: 节点随 Advertise 上报的各提供侧角色的策略来源
          properties:
            egress: { $ref: "#/components/schemas/PolicySource" }
            service: { $ref: "#/components/schemas/PolicySource" }
            executor: { $ref: "#/components/schemas/PolicySource" }
        services:
          type: array
          items: { type: string }
          description: 该节点注册的服务名
        executor:
          type: object
          properties:
            description: { type: string }
            tools:
              type: array
              items: { type: string }
        policy_version_applied:
          type: integer
          description: 受管角色最近确认应用的 PolicyUpdate 版本
    NodePatch:
      type: object
      properties:
        name: { $ref: "#/components/schemas/Label" }
        role_caps:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    Group:
      type: object
      required: [id, name, public_key, status, members]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/Label" }
        public_key:
          allOf: [{ $ref: "#/components/schemas/PublicKey" }]
          description: 组公钥；节点规则里写它，持有该组 membership 证书的 node 即命中
        status: { $ref: "#/components/schemas/GroupStatus" }
        uri: { type: string, description: "`agentd://<base_domain>/group/<name>`" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Label" }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Label" }

    Route:
      type: object
      required: [id, from, proto, domains, to, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/RouteStatus" }
        from:
          allOf: [{ $ref: "#/components/schemas/Subject" }]
          description: 源：`node:`、`group:` 或 `workspace`
        proto:
          type: array
          items: { $ref: "#/components/schemas/Proto" }
          description: 空表示 tls 与 ssh 都适用
        domains:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Match" }
        to:
          type: string
          description: 目的：某个 egress 节点名、`direct` 或 `reject`
    RouteWrite:
      type: object
      required: [from, domains, to]
      properties:
        from: { $ref: "#/components/schemas/Subject" }
        proto:
          type: array
          items: { $ref: "#/components/schemas/Proto" }
        domains:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Match" }
        to: { type: string }
    RouteTable:
      type: object
      required: [version, routes, default]
      properties:
        version: { type: integer, description: 单调递增；分流表与 Ack.rules_version 同源 }
        routes:
          type: array
          items: { $ref: "#/components/schemas/Route" }
          description: 书写顺序即同等具体时的优先顺序
        default:
          type: string
          enum: [direct, reject]
    RouteTableWrite:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/RouteWrite" }
        default:
          type: string
          enum: [direct, reject]
          default: direct

    PolicyTarget:
      type: object
      description: >-
        一条策略的目标，三种之一：写 `egress`（出口节点名，配 proto / domains / ports），写 `exec`（executor 节点名，配 argv / stdin / shell），
        或写 `service`（服务名）。与设计文档里 YAML 的写法相同。
      properties:
        egress:
          allOf: [{ $ref: "#/components/schemas/Label" }]
          description: 出口节点名
        proto:
          allOf: [{ $ref: "#/components/schemas/Proto" }]
          description: egress 的单个协议，默认 tls；两种都要就写两条
        domains:
          type: array
          items: { $ref: "#/components/schemas/Match" }
          description: egress 的域名模式
        ports:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
          description: egress 的目的端口；省略时 tls 443、ssh 22
        exec:
          allOf: [{ $ref: "#/components/schemas/Label" }]
          description: executor 节点名
        argv:
          type: array
          items: { type: string }
          description: argv 前缀；argv[0] 是裸名或绝对路径，执行路径取自规则
        stdin: { type: boolean, description: "允许 write_stdin" }
        shell: { type: boolean, description: "allow 时允许完整 shell；deny 时禁止开 shell" }
        service:
          allOf: [{ $ref: "#/components/schemas/Label" }]
          description: 服务名
      example: { egress: dorm, proto: tls, domains: [{ kind: suffix, value: ucas.edu.cn }] }
    PolicyStatementWrite:
      type: object
      description: 一条中央策略语句：若干主体对若干 target 的 allow 与 deny。渲染时每个主体换成公钥（`public` 换成 `*`），按目的角色拆成 (public_key, action, target) 规则
      required: [subjects]
      properties:
        subjects:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Subject" }
        allow:
          type: array
          items: { $ref: "#/components/schemas/PolicyTarget" }
        deny:
          type: array
          items: { $ref: "#/components/schemas/PolicyTarget" }
        comment: { type: string }
      example:
        subjects: ["group:pc"]
        allow:
          - { egress: dorm, proto: tls, domains: [{ kind: suffix, value: ucas.edu.cn }] }
          - { exec: office, argv: ["lark-cli", "msg"] }
          - { service: nas }
    PolicyStatement:
      allOf:
        - $ref: "#/components/schemas/PolicyStatementWrite"
        - type: object
          required: [id, status]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { $ref: "#/components/schemas/PolicyStatus" }

    Service:
      type: object
      required: [id, name, fqdn, proto, node, state, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        name: { $ref: "#/components/schemas/Label" }
        fqdn: { type: string }
        proto:
          type: string
          enum: [http, ssh]
        node_id: { $ref: "#/components/schemas/Uuid", description: 所在节点实体 UUID }
        node_online: { type: boolean }
        state:
          type: string
          enum: [ready, cert_pending]
        port: { type: integer, description: 成员访问时的端口：http 443，ssh 22 }
        public:
          type: boolean
          description: >-
            该服务节点的生效策略里是否有 `public_key: "*"` 的 allow（只对 http 有意义）

    CertificateKind:
      type: string
      enum: [workspace_wildcard, relay, agentserver]
    CertificateState:
      type: string
      enum: [pending, ready, renewing, expired, revoked, failed, deleted]
    Certificate:
      type: object
      required: [id, kind, state, issuer]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/CertificateKind" }
        workspace_id: { $ref: "#/components/schemas/Uuid" }
        relay_id: { $ref: "#/components/schemas/Uuid" }
        subject: { type: string, description: 证书的 DNS names 或控制面身份 }
        issuer: { $ref: "#/components/schemas/Uuid" }
        state: { $ref: "#/components/schemas/CertificateState" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        renew_before: { type: string, description: 剩余多久进入自动续期窗口 }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: string }
        last_error: { type: string }
        updated_at: { type: string, format: date-time }
    CertificateRevoke:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateIssue:
      type: object
      required: [kind, workspace_id]
      properties:
        kind: { $ref: "#/components/schemas/CertificateKind" }
        workspace_id: { $ref: "#/components/schemas/Uuid" }

    RelayCandidate:
      type: object
      required: [relay_id, url, status]
      properties:
        relay_id: { $ref: "#/components/schemas/Uuid" }
        url: { type: string, format: uri }
        status: { $ref: "#/components/schemas/RelayStatus" }
        connected: { type: boolean }
        preference: { type: integer, description: agentserver 给出的候选顺序，agentd 可结合本地连接质量调整 }

    Relay:
      type: object
      required: [id, name, public_key, url, status, connected]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/RelayStatus" }
        name: { $ref: "#/components/schemas/Label" }
        public_key: { $ref: "#/components/schemas/PublicKey" }
        url: { type: string, description: 基础 URL，如 `https://relay-hk.agentsrv.example.com` }
        transports:
          type: object
          description: transport 名 → 路径
          additionalProperties: { type: string }
          example: { ws: /ws, xhttp: /x, httpupgrade: /up }
        stun: { type: string, description: "host:port" }
        connected: { type: boolean, description: relay 会话是否在线 }
        connected_since: { type: string, format: date-time }
        nodes_online: { type: integer }
    RelayCreate:
      type: object
      required: [name, public_key, url]
      properties:
        name: { $ref: "#/components/schemas/Label" }
        public_key: { $ref: "#/components/schemas/PublicKey" }
        url: { type: string }
        transports:
          type: object
          additionalProperties: { type: string }
          description: 省略则用默认路径 ws /ws、xhttp /x、httpupgrade /up
        stun: { type: string }
    RelayToken:
      type: object
      required: [id, status, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/RelayTokenStatus" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    RelayTokenCreate:
      type: object
      properties:
        ttl: { type: string, description: Go duration，默认 24h }
    RelayTokenCreated:
      allOf:
        - $ref: "#/components/schemas/RelayToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: 令牌明文，只返回这一次；写进 relay 配置的 control.join_token }
    RelayCert:
      type: object
      required: [id, workspace_id, relay_id, state, issued_at, expires_at, cert]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        state: { $ref: "#/components/schemas/CertificateState" }
        workspace_id: { $ref: "#/components/schemas/Uuid" }
        relay_id: { $ref: "#/components/schemas/Uuid" }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        cert:
          type: string
          description: base64url 编码的 RelayCert protobuf，与 relay 的 well-known 端点返回的相同
