name: preview images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish to GHCR
        required: true
        default: preview

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [agentserver, agentrelay, agentd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/agentd/${{ matrix.target }}:${{ inputs.tag }}
          build-args: VERSION=${{ inputs.tag }}
          cache-from: type=gha,scope=preview-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.target }}
