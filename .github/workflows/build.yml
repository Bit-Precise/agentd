name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_linux_arm64:
        description: Also test on the GitHub-hosted Linux ARM64 runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine artifact version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$GITHUB_REF_NAME
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      # Official actions, verified release tags; immutable commit pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify module lockfiles
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.go']).decode().split('\0')
          files = [name for name in files if name]
          changed = subprocess.check_output(['gofmt', '-l', *files], text=True)
          if changed:
              raise SystemExit('Run gofmt on:\n' + changed)
          PY
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test with race detector
        if: matrix.race
        run: go test -mod=readonly -race -timeout=120s ./...
      - name: Test without race detector
        if: ${{ !matrix.race }}
        run: go test -mod=readonly -timeout=120s ./...
      - name: Validate build script
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  test-linux-arm64:
    name: Optional native Linux ARM64 test
    if: github.event_name == 'workflow_dispatch' && inputs.test_linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify dependencies and test natively
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -timeout=120s ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.artifact_arch }})
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: '386', artifact_arch: '386', goarm: ''}
          - {goos: linux, goarch: amd64, artifact_arch: amd64, goarm: ''}
          - {goos: linux, goarch: arm, artifact_arch: arm, goarm: '5'}
          - {goos: linux, goarch: arm, artifact_arch: armhf, goarm: '7'}
          - {goos: linux, goarch: arm64, artifact_arch: arm64, goarm: ''}
          - {goos: darwin, goarch: amd64, artifact_arch: amd64, goarm: ''}
          - {goos: darwin, goarch: arm64, artifact_arch: arm64, goarm: ''}
          - {goos: windows, goarch: amd64, artifact_arch: amd64, goarm: ''}
          - {goos: windows, goarch: '386', artifact_arch: '386', goarm: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify module lockfiles
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Build and package
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          TARGET_ARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          args=(--os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist)
          if [[ -n "$TARGET_ARM" ]]; then args+=(--goarm "$TARGET_ARM"); fi
          bash scripts/build-release.sh "${args[@]}"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-${{ matrix.goos }}-${{ matrix.artifact_arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: Verify and collect all release assets
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: target-*
          path: incoming
          merge-multiple: false
          digest-mismatch: error
      - name: Verify target manifests and generate combined checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil

          groups = sorted(Path('incoming').glob('target-*'))
          if len(groups) != 9:
              raise SystemExit(f'Expected 9 target artifacts, got {len(groups)}')
          output = Path('release')
          output.mkdir()
          sums = []
          for group in groups:
              lines = (group / 'SHA256SUMS').read_text().splitlines()
              if len(lines) != 1:
                  raise SystemExit(f'Expected one archive in {group}')
              digest, name = lines[0].split('  ', 1)
              if Path(name).name != name or not name.endswith(('.tar.gz', '.zip')):
                  raise SystemExit(f'Invalid archive name in {group}')
              source = group / name
              checksum = hashlib.sha256()
              with source.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 20), b''):
                      checksum.update(block)
              actual = checksum.hexdigest()
              if actual != digest or (output / name).exists():
                  raise SystemExit(f'Invalid or duplicate asset: {name}')
              shutil.copyfile(source, output / name)
              sums.append((name, digest))
          (output / 'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(sums)))
          PY
          (cd release && sha256sum --check SHA256SUMS)
      - name: Upload complete release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release
          digest-mismatch: error
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "agentd $RELEASE_TAG"
          fi
