name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_linux_arm64:
        description: Also test natively on Linux ARM64
        type: boolean
        default: false
      signing_platform:
        description: Signing validation platforms (tags always require all)
        type: choice
        options: [all, windows, macos]
        default: all
      signing_validation:
        description: Verify release signing and notarization on main without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.version.outputs.signing }}
      signing_platform: ${{ steps.version.outputs.signing_platform }}
      windows_signing: ${{ steps.version.outputs.windows_signing }}
      macos_signing: ${{ steps.version.outputs.macos_signing }}
      signing_targets: ${{ steps.version.outputs.signing_targets }}
    steps:
      - id: version
        shell: bash
        env:
          SIGNING_PLATFORM: ${{ inputs.signing_platform || 'all' }}
          SIGNING_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_validation }}
        run: |
          set -euo pipefail
          signing=false
          platform=all
          if [[ "$SIGNING_VALIDATION" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Signing validation requires main'; exit 1; }
            signing=true
            platform=$SIGNING_PLATFORM
            [[ "$platform" == all || "$platform" == windows || "$platform" == macos ]] || exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then signing=true; platform=all; fi
          printf 'signing=%s\nsigning_platform=%s\n' "$signing" "$platform" >> "$GITHUB_OUTPUT"
          windows=false; macos=false
          if [[ "$signing" == true ]]; then
            if [[ "$platform" == all || "$platform" == windows ]]; then windows=true; fi
            if [[ "$platform" == all || "$platform" == macos ]]; then macos=true; fi
          fi
          printf 'windows_signing=%s\nmacos_signing=%s\n' "$windows" "$macos" >> "$GITHUB_OUTPUT"
          python3 - "$platform" >> "$GITHUB_OUTPUT" <<'PYMETA'
          import json, sys
          targets = [
              dict(platform='windows', arch='386', runner='windows-latest', binary_stage='exe', installer_stage='msi'),
              dict(platform='windows', arch='amd64', runner='windows-latest', binary_stage='exe', installer_stage='msi'),
              dict(platform='darwin', arch='amd64', runner='macos-15-intel', binary_stage='cli', installer_stage='pkg'),
              dict(platform='darwin', arch='arm64', runner='macos-15', binary_stage='cli', installer_stage='pkg'),
          ]
          requested = {'windows': 'windows', 'macos': 'darwin'}.get(sys.argv[1])
          if requested: targets = [item for item in targets if item['platform'] == requested]
          print('signing_targets=' + json.dumps(targets))
          PYMETA
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA:0:12}"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, race: true}
          - {os: macos-latest, race: true}
          - {os: windows-latest, race: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Vet and test
        shell: bash
        env:
          RACE: ${{ matrix.race }}
        run: |
          set -euo pipefail
          go vet -mod=readonly ./...
          args=(); if [[ "$RACE" == true ]]; then args+=(-race); fi
          go test -mod=readonly "${args[@]}" -timeout=120s ./...
      - name: Release tooling tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.go']).decode().split('\0')
          changed = subprocess.check_output(['gofmt', '-l', *[p for p in files if p]], text=True)
          if changed: raise SystemExit('Run gofmt on:\n' + changed)
          PY

  test-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.test_linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - run: go test -mod=readonly -timeout=120s ./...

  linux:
    name: Linux packages (${{ matrix.arch }}${{ matrix.fips && ', FIPS' || '' }})
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: '386', fips: false}
          - {arch: amd64, fips: false}
          - {arch: arm, fips: false}
          - {arch: armhf, fips: false}
          - {arch: arm64, fips: false}
          - {arch: amd64, fips: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install pinned package builder and RPM inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install-nfpm.py --destination "$RUNNER_TEMP/agentd-tools"
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build real binary, DEB and RPM
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FIPS_BUILD: ${{ matrix.fips }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          args=(); if [[ "$FIPS_BUILD" == true ]]; then args+=(--fips); fi
          bash scripts/build-release.sh --os linux --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist --nfpm "$RUNNER_TEMP/agentd-tools/nfpm" "${args[@]}"
          python3 scripts/release.py verify --out dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -K dist/*.rpm
          test "$(rpm -qp --qf '%{FILEDIGESTALGO}' dist/*.rpm)" = 8
          rpm -qpl dist/*.rpm | grep '^/usr/bin/agentd$'
      - name: Install and remove native amd64 DEB
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          FIPS_BUILD: ${{ matrix.fips }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sudo dpkg -i dist/*.deb
          test "$(/usr/bin/agentd version)" = "$RELEASE_VERSION"
          name=agentd; if [[ "$FIPS_BUILD" == true ]]; then name=agentd-fips; fi
          sudo dpkg -r "$name"
      - name: Verify pinned Go FIPS module at build and runtime
        if: matrix.fips
        shell: bash
        env:
          GOFIPS140: v1.0.0-c2097c7c
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-fips --binary dist/agentd-fips-linux-amd64
          go run -mod=readonly ./scripts/fipsprobe
          go test -mod=readonly -timeout=120s ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-linux-${{ matrix.arch }}${{ matrix.fips && '-fips' || '' }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned macOS TGZ and PKG (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Build native unsigned installer and archive
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-release.sh --os darwin --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          python3 scripts/release.py verify --out dist
          tar -tzf "dist/agentd-darwin-$TARGET_ARCH.tgz"
          test ! -e /usr/local/bin/agentd
          sudo installer -pkg "dist/agentd-$TARGET_ARCH.pkg" -target /
          test "$(/usr/local/bin/agentd version)" = "$RELEASE_VERSION"
          pkgutil --pkg-info com.bit-precise.agentd
          sudo rm /usr/local/bin/agentd
          sudo rm -rf /usr/local/share/doc/agentd
          sudo pkgutil --forget com.bit-precise.agentd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  windows:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned Windows EXE and MSI (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Build native unsigned MSI and verify install/uninstall
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dotnet --list-runtimes
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          python scripts/release.py verify --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows checksums failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-windows-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  signed-prepare:
    name: Prepare signing inputs (${{ matrix.platform }}/${{ matrix.arch }})
    if: needs.metadata.outputs.signing == 'true'
    needs: [metadata, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.signing_targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Build executable and package only explicit release state
        shell: bash
        env:
          TARGET_OS: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/shared-signing.py prepare --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist --signing-output signing-input --state-output build-state.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-input-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.binary_stage }}
          path: signing-input/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-state-${{ matrix.platform }}-${{ matrix.arch }}-built
          path: build-state.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  signed-windows-exe:
    name: Shared windows exe signing (${{ matrix.arch }})
    if: needs.metadata.outputs.windows_signing == 'true'
    needs: [metadata, signed-prepare]
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64]
    permissions: {contents: read, id-token: write}
    uses: Bit-Precise/actions/.github/workflows/sign-windows.yml@v1
    with:
      artifact-name: sign-input-windows-${{ matrix.arch }}-exe
      stage: exe

  signed-macos-cli:
    name: Shared darwin cli signing (${{ matrix.arch }})
    if: needs.metadata.outputs.macos_signing == 'true'
    needs: [metadata, signed-prepare]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions: {contents: read}
    uses: Bit-Precise/actions/.github/workflows/sign-macos.yml@v1
    with:
      artifact-name: sign-input-darwin-${{ matrix.arch }}-cli
      stage: cli
    secrets: inherit

  signed-assemble:
    name: Assemble signed executable (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [metadata, signed-windows-exe, signed-macos-cli]
    if: >-
      ${{ !cancelled() && needs.metadata.outputs.signing == 'true' &&
          (needs.metadata.outputs.windows_signing != 'true' || needs.signed-windows-exe.result == 'success') &&
          (needs.metadata.outputs.macos_signing != 'true' || needs.signed-macos-cli.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.signing_targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sign-state-${{ matrix.platform }}-${{ matrix.arch }}-built
          path: state-input
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sign-input-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.binary_stage }}-signed
          path: signed-input
          digest-mismatch: error
      - name: Verify signed executable and assemble native installer
        shell: bash
        env:
          TARGET_OS: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/shared-signing.py assemble --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist --state-input state-input/build-state.tgz --signed-input signed-input --signing-output signing-input --state-output packaged-state.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-input-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.installer_stage }}
          path: signing-input/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-state-${{ matrix.platform }}-${{ matrix.arch }}-packaged
          path: packaged-state.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  signed-windows-msi:
    name: Shared windows msi signing (${{ matrix.arch }})
    if: needs.metadata.outputs.windows_signing == 'true'
    needs: [metadata, signed-assemble]
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64]
    permissions: {contents: read, id-token: write}
    uses: Bit-Precise/actions/.github/workflows/sign-windows.yml@v1
    with:
      artifact-name: sign-input-windows-${{ matrix.arch }}-msi
      stage: msi

  signed-macos-pkg:
    name: Shared darwin pkg signing (${{ matrix.arch }})
    if: needs.metadata.outputs.macos_signing == 'true'
    needs: [metadata, signed-assemble]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions: {contents: read}
    uses: Bit-Precise/actions/.github/workflows/sign-macos.yml@v1
    with:
      artifact-name: sign-input-darwin-${{ matrix.arch }}-pkg
      stage: pkg
    secrets: inherit

  signed-finalize:
    name: Verify signed release (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [metadata, signed-windows-msi, signed-macos-pkg]
    if: >-
      ${{ !cancelled() && needs.metadata.outputs.signing == 'true' &&
          (needs.metadata.outputs.windows_signing != 'true' || needs.signed-windows-msi.result == 'success') &&
          (needs.metadata.outputs.macos_signing != 'true' || needs.signed-macos-pkg.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.signing_targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sign-state-${{ matrix.platform }}-${{ matrix.arch }}-packaged
          path: state-input
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sign-input-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.installer_stage }}-signed
          path: signed-input
          digest-mismatch: error
      - name: Validate shared receipts, native signatures and final bytes
        shell: bash
        env:
          TARGET_OS: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/shared-signing.py finalize --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist --state-input state-input/packaged-state.tgz --signed-input signed-input
      - name: Install and verify notarized macOS package
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test ! -e /usr/local/bin/agentd
          sudo installer -pkg "dist/agentd-$TARGET_ARCH.pkg" -target /
          cmp "dist/.staging/darwin-$TARGET_ARCH/payload/agentd" /usr/local/bin/agentd
          codesign --verify --strict /usr/local/bin/agentd
          test "$(/usr/local/bin/agentd version)" = "$RELEASE_VERSION"
          sudo rm /usr/local/bin/agentd
          sudo rm -rf /usr/local/share/doc/agentd
          sudo pkgutil --forget com.bit-precise.agentd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  package:
    name: Verify all 26 products and collect release
    needs: [metadata, linux, macos, windows, signed-finalize]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' && needs.linux.result == 'success' &&
          (needs.metadata.outputs.signing != 'true' || needs.metadata.outputs.signing_platform == 'all') &&
          ((needs.macos.result == 'success' && needs.windows.result == 'success') ||
           needs.signed-finalize.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: target-*
          path: incoming
          merge-multiple: false
          digest-mismatch: error
      - name: Verify exact product list and each input checksum
        env:
          REQUIRE_SIGNED: ${{ needs.metadata.outputs.signing }}
        run: |
          set -euo pipefail
          args=(); if [[ "$REQUIRE_SIGNED" == true ]]; then args+=(--require-signed); fi
          python3 scripts/release.py collect --incoming incoming --out release "${args[@]}"
          python3 scripts/release.py verify --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish verified tagged assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release
          digest-mismatch: error
      - name: Publish verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "agentd $RELEASE_TAG"
          fi
