name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_linux_arm64:
        description: Also test natively on Linux ARM64
        type: boolean
        default: false
      signing_platform:
        description: Signing validation platforms (tags always require all)
        type: choice
        options: [all, windows, macos]
        default: all
      signing_validation:
        description: Verify release signing and notarization on main without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.signing_validation && inputs.signing_platform || 'build' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.version.outputs.signing }}
      signing_platform: ${{ steps.version.outputs.signing_platform }}
      windows_signing: ${{ steps.version.outputs.windows_signing }}
      macos_signing: ${{ steps.version.outputs.macos_signing }}
    steps:
      - id: version
        shell: bash
        env:
          SIGNING_PLATFORM: ${{ inputs.signing_platform || 'all' }}
          SIGNING_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_validation }}
        run: |
          set -euo pipefail
          signing=false
          platform=all
          if [[ "$SIGNING_VALIDATION" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Signing validation requires main'; exit 1; }
            signing=true
            platform=$SIGNING_PLATFORM
            [[ "$platform" == all || "$platform" == windows || "$platform" == macos ]] || exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then signing=true; platform=all; fi
          printf 'signing=%s\nsigning_platform=%s\n' "$signing" "$platform" >> "$GITHUB_OUTPUT"
          windows=false; macos=false
          if [[ "$signing" == true ]]; then
            if [[ "$platform" == all || "$platform" == windows ]]; then windows=true; fi
            if [[ "$platform" == all || "$platform" == macos ]]; then macos=true; fi
          fi
          printf 'windows_signing=%s\nmacos_signing=%s\n' "$windows" "$macos" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA:0:12}"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, race: true}
          - {os: macos-latest, race: true}
          - {os: windows-latest, race: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Vet and test
        shell: bash
        env:
          RACE: ${{ matrix.race }}
        run: |
          set -euo pipefail
          go vet -mod=readonly ./...
          args=(); if [[ "$RACE" == true ]]; then args+=(-race); fi
          go test -mod=readonly "${args[@]}" -timeout=120s ./...
      - name: Release tooling tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.go']).decode().split('\0')
          changed = subprocess.check_output(['gofmt', '-l', *[p for p in files if p]], text=True)
          if changed: raise SystemExit('Run gofmt on:\n' + changed)
          PY

  test-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.test_linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - run: go test -mod=readonly -timeout=120s ./...

  linux:
    if: needs.metadata.outputs.signing != 'true' || needs.metadata.outputs.signing_platform == 'all'
    name: Linux packages (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm64, armv6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Install RPM inspector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build tar.gz, DEB and RPM with GoReleaser
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-release.sh --os linux --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          python3 scripts/release.py verify --out dist
          python3 scripts/release.py verify-archive --os linux --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -K dist/*.rpm
          test "$(rpm -qp --qf '%{FILEDIGESTALGO}' dist/*.rpm)" = 8
          rpm -qpl dist/*.rpm | grep '^/usr/bin/agentd$'
      - name: Install and remove native amd64 DEB
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sudo dpkg -i dist/*.deb
          test "$(/usr/bin/agentd version)" = "$RELEASE_VERSION"
          sudo dpkg -r agentd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-linux-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned macOS ZIP (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Build native unsigned ZIP through GoReleaser
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py build --os darwin --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          python3 scripts/release.py verify --out dist
          python3 scripts/release.py verify-archive --os darwin --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          test "$(dist/.staging/darwin-$TARGET_ARCH/payload/agentd version)" = "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  windows:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned Windows ZIP and MSI (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Build native unsigned MSI and verify install/uninstall
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dotnet --list-runtimes
          $smoke = @{}
          if ($env:TARGET_ARCH -ne 'arm64') { $smoke.SmokeTest = $true }
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist @smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          python scripts/release.py verify --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows checksums failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-windows-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos-signed:
    name: Signed and notarized macOS ZIP (${{ matrix.arch }})
    if: needs.metadata.outputs.macos_signing == 'true'
    needs: [metadata, test]
    environment: release-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Sign through GoReleaser hook and notarize the final ZIP (required)
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          APPLE_APPLICATION_IDENTITY: ${{ vars.APPLE_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APPLICATION_P12_BASE64: ${{ secrets.APPLE_APPLICATION_P12_BASE64 }}
          APPLE_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: python3 scripts/sign-macos.py --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
      - name: Verify signed and notarized ZIP payload
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py verify --out dist
          python3 scripts/release.py verify-archive --os darwin --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          codesign --verify --strict "dist/.staging/darwin-$TARGET_ARCH/payload/agentd"
          test "$(dist/.staging/darwin-$TARGET_ARCH/payload/agentd version)" = "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  windows-signed:
    name: Azure signed Windows (${{ matrix.arch }})
    if: needs.metadata.outputs.windows_signing == 'true'
    needs: [metadata, test]
    environment: release-signing
    permissions: {contents: read, id-token: write}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AGENTD_SIGN_ARTIFACTS: 'true'
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Require Azure signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing variable $name" }
          }
      - name: Azure login using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare pinned Azure signing client for GoReleaser hooks
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Prepare
      - name: Build and sign EXE through GoReleaser post-build hook
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python scripts/release.py build --os windows --arch $env:TARGET_ARCH --version $env:RELEASE_VERSION --out dist --no-manifest
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable build or signing failed' }
      - name: Build MSI containing the verified signed EXE
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -Stage Package -RequireSigned -SignTool $env:SIGNTOOL_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI assembly failed' }
      - name: Sign MSI using the same Azure signing helper
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $products = python scripts/release.py products --os windows --arch $env:TARGET_ARCH --version $env:RELEASE_VERSION | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine MSI product name' }
          $msi = @($products.assets | Where-Object { $_ -like '*.msi' })
          if ($msi.Count -ne 1) { throw 'Expected exactly one MSI product' }
          ./scripts/sign-windows.ps1 -Path (Join-Path dist $msi[0])
      - name: Verify both signatures, timestamps and installation before checksums
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $smoke = @{}
          if ($env:TARGET_ARCH -ne 'arm64') { $smoke.SmokeTest = $true }
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -Stage Finalize -RequireSigned -SignTool $env:SIGNTOOL_PATH @smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows signature or installer verification failed' }
          python scripts/release.py verify --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows checksums failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-windows-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos-universal:
    name: Build unsigned universal macOS PKG
    if: needs.metadata.outputs.signing != 'true'
    needs: [metadata, macos]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-darwin-amd64
          path: incoming/amd64
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-darwin-arm64
          path: incoming/arm64
          digest-mismatch: error
      - name: Build universal PKG from the two verified ZIPs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release.py universal --amd64-input incoming/amd64 --arm64-input incoming/arm64 --version "$RELEASE_VERSION" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-universal
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos-universal-signed:
    name: Sign and notarize universal macOS PKG
    if: needs.metadata.outputs.macos_signing == 'true'
    needs: [metadata, macos-signed]
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-darwin-amd64
          path: incoming/amd64
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-darwin-arm64
          path: incoming/arm64
          digest-mismatch: error
      - name: Sign universal CLI, sign PKG, notarize and staple
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          APPLE_APPLICATION_IDENTITY: ${{ vars.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APPLICATION_P12_BASE64: ${{ secrets.APPLE_APPLICATION_P12_BASE64 }}
          APPLE_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          APPLE_INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: python3 scripts/sign-macos.py universal --amd64-input incoming/amd64 --arm64-input incoming/arm64 --version "$RELEASE_VERSION" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-universal
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos-universal-test:
    name: Install universal PKG (${{ matrix.os }})
    needs: [metadata, macos-universal, macos-universal-signed]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' &&
          (needs.macos-universal.result == 'success' || needs.macos-universal-signed.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-darwin-universal
          path: dist
          digest-mismatch: error
      - name: Verify and install the same universal PKG on this architecture
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          REQUIRE_SIGNED: ${{ needs.metadata.outputs.macos_signing }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_SIGNED" == true ]]; then
            python3 scripts/verify-macos-package.py --out dist --version "$RELEASE_VERSION" --require-signed
          else
            python3 scripts/verify-macos-package.py --out dist --version "$RELEASE_VERSION"
          fi

  windows-arm64-test:
    name: Install Windows ARM64 MSI natively
    needs: [metadata, windows, windows-signed]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' &&
          (needs.windows.result == 'success' || needs.windows-signed.result == 'success') }}
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target-windows-arm64
          path: dist
          digest-mismatch: error
      - name: Verify signatures, ZIP payload and native MSI installation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          REQUIRE_SIGNED: ${{ needs.metadata.outputs.windows_signing }}
        run: |
          $verify = @{}
          if ($env:REQUIRE_SIGNED -eq 'true') { $verify.RequireSigned = $true }
          ./scripts/build-windows.ps1 -Architecture arm64 -Version $env:RELEASE_VERSION -OutDir dist -Stage Verify -SmokeTest @verify
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 Windows installer verification failed' }

  package:
    name: Verify 21 products and collect 22 release assets
    needs: [metadata, linux, macos, windows, macos-signed, windows-signed, macos-universal-test, windows-arm64-test]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' && needs.linux.result == 'success' &&
          (needs.metadata.outputs.signing != 'true' || needs.metadata.outputs.signing_platform == 'all') &&
          (needs.macos.result == 'success' || needs.macos-signed.result == 'success') &&
          (needs.windows.result == 'success' || needs.windows-signed.result == 'success') &&
          needs.macos-universal-test.result == 'success' && needs.windows-arm64-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: target-*
          path: dist/incoming
          merge-multiple: false
          digest-mismatch: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Verify exact product list and each input checksum
        env:
          REQUIRE_SIGNED: ${{ needs.metadata.outputs.signing }}
        run: |
          set -euo pipefail
          args=(); if [[ "$REQUIRE_SIGNED" == true ]]; then args+=(--require-signed); fi
          python3 scripts/release.py collect --incoming dist/incoming --out dist/release "${args[@]}"
          python3 scripts/release.py publish --out dist/release --dry-run
          python3 scripts/release.py verify --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: dist/release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish verified tagged assets with GoReleaser
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: dist/release
          digest-mismatch: error
      - name: Publish signed and verified artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --out dist/release
