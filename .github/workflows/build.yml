name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_linux_arm64:
        description: Also test natively on Linux ARM64
        type: boolean
        default: false
      signing_validation:
        description: Verify release signing and notarization on main without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - id: version
        shell: bash
        env:
          SIGNING_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_validation }}
        run: |
          set -euo pipefail
          signing=false
          if [[ "$SIGNING_VALIDATION" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Signing validation requires main'; exit 1; }
            signing=true
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then signing=true; fi
          printf 'signing=%s\n' "$signing" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA:0:12}"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, race: true}
          - {os: macos-latest, race: true}
          - {os: windows-latest, race: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Vet and test
        shell: bash
        env:
          RACE: ${{ matrix.race }}
        run: |
          set -euo pipefail
          go vet -mod=readonly ./...
          args=(); if [[ "$RACE" == true ]]; then args+=(-race); fi
          go test -mod=readonly "${args[@]}" -timeout=120s ./...
      - name: Release tooling tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.go']).decode().split('\0')
          changed = subprocess.check_output(['gofmt', '-l', *[p for p in files if p]], text=True)
          if changed: raise SystemExit('Run gofmt on:\n' + changed)
          PY

  test-linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.test_linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - run: go test -mod=readonly -timeout=120s ./...

  linux:
    name: Linux packages (${{ matrix.arch }}${{ matrix.fips && ', FIPS' || '' }})
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: '386', fips: false}
          - {arch: amd64, fips: false}
          - {arch: arm, fips: false}
          - {arch: armhf, fips: false}
          - {arch: arm64, fips: false}
          - {arch: amd64, fips: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Install pinned package builder and RPM inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install-nfpm.py --destination "$RUNNER_TEMP/agentd-tools"
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build real binary, DEB and RPM
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FIPS_BUILD: ${{ matrix.fips }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          args=(); if [[ "$FIPS_BUILD" == true ]]; then args+=(--fips); fi
          bash scripts/build-release.sh --os linux --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist --nfpm "$RUNNER_TEMP/agentd-tools/nfpm" "${args[@]}"
          python3 scripts/release.py verify --out dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -K dist/*.rpm
          test "$(rpm -qp --qf '%{FILEDIGESTALGO}' dist/*.rpm)" = 8
          rpm -qpl dist/*.rpm | grep '^/usr/bin/agentd$'
      - name: Install and remove native amd64 DEB
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          FIPS_BUILD: ${{ matrix.fips }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sudo dpkg -i dist/*.deb
          test "$(/usr/bin/agentd version)" = "$RELEASE_VERSION"
          name=agentd; if [[ "$FIPS_BUILD" == true ]]; then name=agentd-fips; fi
          sudo dpkg -r "$name"
      - name: Verify pinned Go FIPS module at build and runtime
        if: matrix.fips
        shell: bash
        env:
          GOFIPS140: v1.0.0-c2097c7c
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-fips --binary dist/agentd-fips-linux-amd64
          go run -mod=readonly ./scripts/fipsprobe
          go test -mod=readonly -timeout=120s ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-linux-${{ matrix.arch }}${{ matrix.fips && '-fips' || '' }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned macOS TGZ and PKG (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Build native unsigned installer and archive
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-release.sh --os darwin --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
          python3 scripts/release.py verify --out dist
          tar -tzf "dist/agentd-darwin-$TARGET_ARCH.tgz"
          test ! -e /usr/local/bin/agentd
          sudo installer -pkg "dist/agentd-$TARGET_ARCH.pkg" -target /
          test "$(/usr/local/bin/agentd version)" = "$RELEASE_VERSION"
          pkgutil --pkg-info com.bit-precise.agentd
          sudo rm /usr/local/bin/agentd
          sudo rm -rf /usr/local/share/doc/agentd
          sudo pkgutil --forget com.bit-precise.agentd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  windows:
    if: needs.metadata.outputs.signing != 'true'
    name: Unsigned Windows EXE and MSI (${{ matrix.arch }})
    needs: [metadata, test]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}'}
      - name: Build native unsigned MSI and verify install/uninstall
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dotnet --list-runtimes
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          python scripts/release.py verify --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows checksums failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-windows-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  macos-signed:
    name: Signed and notarized macOS (${{ matrix.arch }})
    if: needs.metadata.outputs.signing == 'true'
    needs: [metadata, test]
    environment: release-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-15, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Developer ID sign, notarize and staple (required)
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          APPLE_APPLICATION_IDENTITY: ${{ vars.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APPLICATION_P12_BASE64: ${{ secrets.APPLE_APPLICATION_P12_BASE64 }}
          APPLE_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          APPLE_INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: python3 scripts/sign-macos.py --arch "$TARGET_ARCH" --version "$RELEASE_VERSION" --out dist
      - name: Install and verify signed package
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py verify --out dist
          test ! -e /usr/local/bin/agentd
          sudo installer -pkg "dist/agentd-$TARGET_ARCH.pkg" -target /
          test "$(/usr/local/bin/agentd version)" = "$RELEASE_VERSION"
          codesign --verify --strict /usr/local/bin/agentd
          sudo rm /usr/local/bin/agentd
          sudo rm -rf /usr/local/share/doc/agentd
          sudo pkgutil --forget com.bit-precise.agentd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-darwin-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  windows-signed:
    name: Azure signed Windows (${{ matrix.arch }})
    if: needs.metadata.outputs.signing == 'true'
    needs: [metadata, test]
    environment: release-signing
    permissions: {contents: read, id-token: write}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Require Azure signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing variable $name" }
          }
      - name: Build EXE before signing
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python scripts/release.py build --os windows --arch $env:TARGET_ARCH --version $env:RELEASE_VERSION --out dist --no-manifest
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable build failed' }
      - name: Azure login using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign EXE with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\agentd-windows-${{ matrix.arch }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
          trace: false
      - name: Build MSI containing the verified signed EXE
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -Stage Package -RequireSigned
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI assembly failed' }
      - name: Sign MSI with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\agentd-windows-${{ matrix.arch }}.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
          trace: false
      - name: Verify both signatures, timestamps and installation before checksums
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ./scripts/build-windows.ps1 -Architecture $env:TARGET_ARCH -Version $env:RELEASE_VERSION -OutDir dist -Stage Finalize -RequireSigned -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows signature or installer verification failed' }
          python scripts/release.py verify --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows checksums failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-windows-${{ matrix.arch }}
          path: dist/**
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0

  package:
    name: Verify all 26 products and collect release
    needs: [metadata, linux, macos, windows, macos-signed, windows-signed]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' && needs.linux.result == 'success' &&
          (needs.macos.result == 'success' || needs.macos-signed.result == 'success') &&
          (needs.windows.result == 'success' || needs.windows-signed.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: target-*
          path: incoming
          merge-multiple: false
          digest-mismatch: error
      - name: Verify exact product list and each input checksum
        env:
          REQUIRE_SIGNED: ${{ needs.metadata.outputs.signing }}
        run: |
          set -euo pipefail
          args=(); if [[ "$REQUIRE_SIGNED" == true ]]; then args+=(--require-signed); fi
          python3 scripts/release.py collect --incoming incoming --out release "${args[@]}"
          python3 scripts/release.py verify --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish verified tagged assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentd-release-${{ needs.metadata.outputs.version }}
          path: release
          digest-mismatch: error
      - name: Publish verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "agentd $RELEASE_TAG"
          fi
