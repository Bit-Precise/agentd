name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go test (linux, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      AGENTD_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and gofmt
        run: make vet
      - name: generated code is up to date
        run: |
          make gen
          git diff --exit-code -- internal/wire/pb internal/adminapi
      - name: test
        run: go test -race -count=1 ./...

  go-cross-os:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Packages that need PostgreSQL skip when it cannot start.
      - run: go test -count=1 ./internal/identity/... ./internal/wire/... ./internal/session/... ./internal/transport/... ./internal/policy/... ./internal/routes/... ./internal/sniff/... ./internal/task/... ./internal/agent/... ./internal/relay/... ./internal/cliutil/...

  tun-e2e:
    name: tun end-to-end (${{ matrix.os }})
    # Real TUN devices: the elevator runs with sudo (macOS, Linux) or on the
    # elevated Windows runner; capture mode fakeip leaves the runner's own
    # traffic alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, override_dns: "1" }
          - { os: macos-latest, override_dns: "1" }
          - { os: windows-latest, override_dns: "0" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      AGENTD_TUN_E2E: "1"
      AGENTD_TUN_OVERRIDE_DNS: ${{ matrix.override_dns }}
      AGENTD_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wintun
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          echo "AGENTD_WINTUN_DLL=$(pwd -W)/wintun/bin/amd64/wintun.dll" >> "$GITHUB_ENV"
      - name: tun end-to-end
        run: go test -count=1 -run TestTUNEndToEnd -v ./internal/sim/

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=.exe
          for c in agentd agentserver agentrelay; do
            go build -trimpath -ldflags "-s -w" -o "out/$c-$GOOS-$GOARCH$ext" ./cmd/$c
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/

  sign-dry-run:
    name: macOS signing (dry run)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build darwin binaries
        run: make dist PLATFORMS="darwin/amd64 darwin/arm64" VERSION=v0.0.0-ci
      # The release signs with the org's Developer ID in the release-signing
      # environment; here a throwaway identity exercises the same script.
      - name: sign with a throwaway identity
        run: |
          scripts/release/test-identity.sh > "$RUNNER_TEMP/id.env"
          set -a; . "$RUNNER_TEMP/id.env"; set +a
          SKIP_NOTARIZE=1 scripts/release/sign-macos.sh dist 0.0.0-ci
          unzip -l dist/agentd_0.0.0-ci_darwin_arm64.zip

  web:
    name: web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: generate from OpenAPI, typecheck and build
        run: pnpm build
      - name: render tests (every generated resource, generated forms)
        run: pnpm test
      - name: generated client is up to date
        run: git diff --exit-code -- src/api
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: lint
        run: helm lint deploy/helm/agentd
      - name: install dry run (renders NOTES too)
        run: |
          helm install t deploy/helm/agentd --dry-run=client > /dev/null
          for f in minimal production; do
            helm install t deploy/helm/agentd --dry-run=client -f "deploy/helm/agentd/ci/$f-values.yaml" > /dev/null
          done
      - name: rendered configs pass the real parsers
        run: |
          helm template t deploy/helm/agentd | go run ./tools/checkconfig
          helm template t deploy/helm/agentd -f deploy/helm/agentd/ci/minimal-values.yaml | go run ./tools/checkconfig
          helm template t deploy/helm/agentd -f deploy/helm/agentd/ci/production-values.yaml | go run ./tools/checkconfig
      - name: kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          helm template t deploy/helm/agentd | "$(go env GOPATH)/bin/kubeconform" -strict -summary
          helm template t deploy/helm/agentd -f deploy/helm/agentd/ci/production-values.yaml | "$(go env GOPATH)/bin/kubeconform" -strict -summary

  images:
    name: images
    if: github.event_name == 'push'
    needs: [go, web, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [agentserver, agentrelay, agentd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/agentd/${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
