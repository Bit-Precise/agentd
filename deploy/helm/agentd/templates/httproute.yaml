{{- $s := .Values.agentserver -}}
{{- if $s.httpRoute.enabled }}
{{- if not $s.httpRoute.hostnames }}{{ fail "agentserver.httpRoute.hostnames must contain at least one hostname" }}{{ end }}
{{- if not $s.httpRoute.parentRefs }}{{ fail "agentserver.httpRoute.parentRefs must contain a Gateway reference" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentd.fullname" . }}-admin
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
    {{- with $s.httpRoute.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with $s.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames: {{ toJson $s.httpRoute.hostnames }}
  parentRefs: {{ toYaml $s.httpRoute.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ default "/" $s.httpRoute.path | quote }} }
      backendRefs:
        - name: {{ include "agentd.serverSvc" . }}
          port: {{ $s.service.adminPort }}
{{- end }}
