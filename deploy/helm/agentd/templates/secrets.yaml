{{- $full := include "agentd.fullname" . -}}
{{- if not .Values.agentserver.existingSecret }}
{{- $name := printf "%s-agentserver" $full }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ default (include "agentd.keep" (list . $name "admin-token" (randAlphaNum 40))) .Values.agentserver.adminToken | quote }}
  state-key: {{ default (include "agentd.keep" (list . $name "state-key" (randAlphaNum 48))) .Values.agentserver.stateKey | quote }}
  relay-join-token: {{ default (include "agentd.keep" (list . $name "relay-join-token" (randAlphaNum 40))) .Values.agentserver.relayJoinToken | quote }}
{{- end }}
---
{{- /* One chart CA: agentserver's relay-session certificate, certificates
       for relays in tls.mode selfsigned, and agentserver's development CA
       (selfsigned issuer) all chain to it. The CA is kept across upgrades. */}}
{{- $tlsName := printf "%s-agentserver-tls" $full }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $ca := dict }}
{{- if and $existing (index $existing.data "ca.key") }}
{{- $ca = buildCustomCert (index $existing.data "ca.crt") (index $existing.data "ca.key") }}
{{- else }}
{{- $ca = genCA (printf "%s agentd CA" $full) 3650 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels: {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
{{- if and $existing (index $existing.data "tls.crt") (index $existing.data "ca.key") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $svc := include "agentd.serverSvc" . }}
{{- $cert := genSignedCert (include "agentd.serverHost" .) nil (list .Values.domain $svc (printf "%s.%s" $svc .Release.Namespace) (include "agentd.serverHost" .) (printf "%s.cluster.local" (include "agentd.serverHost" .))) 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- range $item := .Values.relays }}
{{- if eq (default "selfsigned" (($item.tls | default dict).mode)) "selfsigned" }}
{{- $rn := printf "%s-%s-tls" $full $item.name }}
{{- $rex := lookup "v1" "Secret" $.Release.Namespace $rn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rn }}
  labels: {{- include "agentd.labels" $ | nindent 4 }}
  annotations:
    agentd.dev/domain: {{ $item.domain | quote }}
type: kubernetes.io/tls
data:
{{- if and $rex (index $rex.data "tls.crt") (eq (index ($rex.metadata.annotations | default dict) "agentd.dev/domain") $item.domain) }}
  tls.crt: {{ index $rex.data "tls.crt" }}
  tls.key: {{ index $rex.data "tls.key" }}
{{- else }}
{{- $c := genSignedCert $item.domain nil (list $item.domain) 3650 $ca }}
  tls.crt: {{ $c.Cert | b64enc }}
  tls.key: {{ $c.Key | b64enc }}
{{- end }}
{{- end }}
{{- end }}
---
{{- if and .Values.postgresql.enabled }}
{{- $pg := printf "%s-postgresql" $full }}
{{- $pass := default (include "agentd.keep" (list . $pg "password" (randAlphaNum 32))) .Values.postgresql.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg }}
  labels: {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pass | quote }}
  url: {{ printf "postgres://agentd:%s@%s:5432/agentd?sslmode=disable" $pass $pg | quote }}
{{- else if and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-database
  labels: {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
