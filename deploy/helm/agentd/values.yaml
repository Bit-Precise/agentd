# Images: <registry>/<repository>/<component>:<tag>
image:
  registry: ghcr.io
  repository: bit-precise/agentd
  tag: ""                 # defaults to the chart appVersion (edge in the repository, the version in releases)
  pullPolicy: IfNotPresent
imagePullSecrets: []

# agentserver's own domain; workspaces default to <name>.<domain>.
domain: agentsrv.example.com

agentserver:
  # Secrets are generated on install and kept on upgrade. Set existingSecret to
  # manage them yourself (keys: admin-token, state-key, relay-join-token).
  existingSecret: ""
  adminToken: ""
  stateKey: ""
  relayJoinToken: ""
  # Workspace wildcard certificates come from the dnsProviders entry whose
  # zones hold the workspace's base domain (the longest zone wins), else from
  # defaultDnsProvider: "selfsigned" (dev; browsers and nodes need the CA) or
  # the name of an entry.
  defaultDnsProvider: selfsigned
  # ACME DNS-01 through Cloudflare or DNSPod (Tencent Cloud API 3.0); a zone
  # belongs to one entry. Certificates come from Let's Encrypt unless
  # acmeDirectory names another CA; a CA that requires an external account
  # binding (Google Trust Services) also needs eabKeyIdSecret and
  # eabHmacKeySecret. Entries with the same acmeDirectory and email share one
  # ACME account, registered once. Check the zones' CAA records allow the CA.
  dnsProviders: {}
  #  cf-main:
  #    provider: cloudflare
  #    zones: [agentsrv.example.com]
  #    email: ops@example.com
  #    tokenSecret: { name: cloudflare-api, key: token }
  #  dnspod:
  #    provider: dnspod
  #    zones: [example.cn]
  #    email: ops@example.com
  #    secretIdSecret: { name: dnspod-api, key: secret-id }
  #    secretKeySecret: { name: dnspod-api, key: secret-key }
  #    acmeDirectory: ""        # default Let's Encrypt; Google Trust Services: https://dv.acme-v02.api.pki.goog/directory
  #    eabKeyIdSecret: { name: gts-eab, key: key-id }        # EAB key id (gcloud publicca external-account-keys create)
  #    eabHmacKeySecret: { name: gts-eab, key: hmac-key }    # its b64MacKey
  #    accountKeySecret: {}     # optional PEM ACME account key; default: generated and kept in the database
  #    propagationWait: ""      # wait before asking the CA to validate; default 30s
  relayCertTTL: 720h
  log: { level: info, format: json }
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    relayPort: 8443        # relay sessions (TLS, chart-generated CA)
    adminPort: 7800        # admin API and web console (plain HTTP; keep it private)
  # Exposes the admin API and console. Protect it (VPN, IP allowlist, auth proxy).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: console.agentsrv.example.com
    tls: []

# One entry per relay. Each relay gets a stable key (Secret), registers itself
# with the bootstrap token and is reachable by nodes at https://<domain>.
relays:
  - name: relay-1
    domain: relay-1.agentsrv.example.com
    # tls.mode: selfsigned (dev), acme (TLS-ALPN-01; the Service must receive
    # :443 for the domain), or file (secretName of a kubernetes.io/tls Secret,
    # e.g. from cert-manager).
    tls:
      mode: selfsigned
      email: ""
      secretName: ""
    service:
      type: LoadBalancer
      port: 443
      annotations: {}
      loadBalancerIP: ""
    stun:
      enabled: false
      port: 3478
    resources: {}

postgresql:
  enabled: true
  image: postgres:17-alpine
  password: ""             # generated when empty
  storage: 8Gi
  storageClass: ""
  resources: {}

# Used when postgresql.enabled is false.
externalDatabase:
  url: ""                  # postgres://user:pass@host:5432/db?sslmode=require
  existingSecret: ""       # Secret with key "url"
